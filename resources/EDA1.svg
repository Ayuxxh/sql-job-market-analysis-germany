<svg viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c1a"/>
      <stop offset="1" stop-color="#151b3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="cardStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="titleLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="fileTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="fileAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="fileViolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>

    <linearGradient id="arrTeal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.2"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="arrAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.2"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="arrViolet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>

    <marker id="headTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2dd4bf"/></marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#fbbf24"/></marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/></marker>

    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4a78"/>
      <stop offset="0.45" stop-color="#8fa3d6"/>
      <stop offset="1" stop-color="#34416b"/>
    </linearGradient>
    <linearGradient id="cylTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d4f5"/>
      <stop offset="1" stop-color="#6c80b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <rect width="1600" height="1100" fill="url(#dots)"/>
  <circle cx="280" cy="560" r="380" fill="url(#glow1)"/>
  <circle cx="1340" cy="640" r="420" fill="url(#glow2)"/>

  <!-- Column titles -->
  <g fill="#eef2ff" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1">
    <text x="280" y="78">Data Warehouse</text>
    <text x="800" y="78">SQL Analytics</text>
    <text x="1320" y="78">Data Insights</text>
  </g>
  <rect x="120" y="98" width="1360" height="3" rx="1.5" fill="url(#titleLine)" opacity="0.55"/>

  <!-- Cards -->
  <g fill="#ffffff" fill-opacity="0.045" stroke="url(#cardStroke)" stroke-width="2">
    <rect x="60" y="130" width="440" height="920" rx="30"/>
    <rect x="580" y="130" width="440" height="920" rx="30"/>
    <rect x="1100" y="130" width="440" height="920" rx="30"/>
  </g>

  <!-- ===== Column 1: Data warehouse ===== -->
  <g filter="url(#shadow)">
    <path d="M150 420 V640 A130 42 0 0 0 410 640 V420 Z" fill="url(#cyl)"/>
    <path d="M150 500 A130 42 0 0 0 410 500" fill="none" stroke="#e5ecff" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M150 570 A130 42 0 0 0 410 570" fill="none" stroke="#e5ecff" stroke-opacity="0.45" stroke-width="3"/>
    <ellipse cx="280" cy="420" rx="130" ry="42" fill="url(#cylTop)"/>
  </g>
  <!-- DuckDB-style badge -->
  <g transform="translate(280 535)">
    <circle r="68" fill="#ffd84d" stroke="#fff3b0" stroke-width="4"/>
    <circle cx="-14" cy="-4" r="34" fill="#111"/>
    <path d="M14 -4 h14 a12 12 0 0 1 0 24 h-14 z" fill="#111"/>
  </g>
  <g text-anchor="middle" fill="#eef2ff">
    <text x="280" y="735" font-size="34" font-weight="700">Data Science</text>
    <text x="280" y="777" font-size="34" font-weight="700">Job Postings</text>
    <text x="280" y="820" font-size="22" fill="#9fb0d8">(DuckDB - OLAP Engine)</text>
  </g>
  <!-- MotherDuck footer -->
  <g transform="translate(170 975)">
    <path d="M0 22 q6 -22 22 -26 q-2 16 -6 30 z" fill="#d97a3c"/>
    <path d="M26 6 q10 -14 26 -14 q-4 14 -12 26 z" fill="#e8934f"/>
    <text x="70" y="26" font-size="30" font-weight="600" fill="#cbd5f0">MotherDuck</text>
  </g>

  <!-- ===== Arrows col1 -> col2 ===== -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M450 270 H700" stroke="#2dd4bf" stroke-opacity="0.85" marker-end="url(#headTeal)"/>
    <path d="M450 565 H700" stroke="#fbbf24" stroke-opacity="0.85" marker-end="url(#headAmber)"/>
    <path d="M450 860 H700" stroke="#a78bfa" stroke-opacity="0.85" marker-end="url(#headViolet)"/>
  </g>

  <!-- ===== Column 2: SQL files ===== -->
  <!-- file 1 -->
  <g transform="translate(750 185)" filter="url(#shadow)">
    <path d="M0 0 H70 L100 30 V130 H0 Z" fill="url(#fileTeal)"/>
    <path d="M70 0 V30 H100 Z" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="14" y="18" width="40" height="7" rx="3.5" fill="#fff" fill-opacity="0.7"/>
    <rect x="14" y="34" width="28" height="7" rx="3.5" fill="#fff" fill-opacity="0.5"/>
    <rect x="-12" y="70" width="124" height="46" rx="12" fill="#0b1226" stroke="#5eead4" stroke-width="3"/>
    <text x="50" y="104" text-anchor="middle" font-size="32" font-weight="800" fill="#e6fffb">SQL</text>
  </g>
  <text x="800" y="355" text-anchor="middle" font-size="23" fill="#d6fff8" font-family="Consolas,'DejaVu Sans Mono',monospace">01_top_demanded_skills.sql</text>

  <!-- file 2 -->
  <g transform="translate(750 480)" filter="url(#shadow)">
    <path d="M0 0 H70 L100 30 V130 H0 Z" fill="url(#fileAmber)"/>
    <path d="M70 0 V30 H100 Z" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="14" y="18" width="40" height="7" rx="3.5" fill="#fff" fill-opacity="0.7"/>
    <rect x="14" y="34" width="28" height="7" rx="3.5" fill="#fff" fill-opacity="0.5"/>
    <rect x="-12" y="70" width="124" height="46" rx="12" fill="#0b1226" stroke="#fbbf24" stroke-width="3"/>
    <text x="50" y="104" text-anchor="middle" font-size="32" font-weight="800" fill="#fff7dd">SQL</text>
  </g>
  <text x="800" y="650" text-anchor="middle" font-size="23" fill="#fff0c2" font-family="Consolas,'DejaVu Sans Mono',monospace">02_top_paying_skills.sql</text>

  <!-- file 3 -->
  <g transform="translate(750 775)" filter="url(#shadow)">
    <path d="M0 0 H70 L100 30 V130 H0 Z" fill="url(#fileViolet)"/>
    <path d="M70 0 V30 H100 Z" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="14" y="18" width="40" height="7" rx="3.5" fill="#fff" fill-opacity="0.7"/>
    <rect x="14" y="34" width="28" height="7" rx="3.5" fill="#fff" fill-opacity="0.5"/>
    <rect x="-12" y="70" width="124" height="46" rx="12" fill="#0b1226" stroke="#a78bfa" stroke-width="3"/>
    <text x="50" y="104" text-anchor="middle" font-size="32" font-weight="800" fill="#f1ebff">SQL</text>
  </g>
  <text x="800" y="945" text-anchor="middle" font-size="23" fill="#eadfff" font-family="Consolas,'DejaVu Sans Mono',monospace">03_optimal_skills.sql</text>

  <!-- ===== Arrows col2 -> col3 ===== -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M885 270 H1190" stroke="#2dd4bf" stroke-opacity="0.85" marker-end="url(#headTeal)"/>
    <path d="M885 565 H1190" stroke="#fbbf24" stroke-opacity="0.85" marker-end="url(#headAmber)"/>
    <path d="M885 860 H1190" stroke="#a78bfa" stroke-opacity="0.85" marker-end="url(#headViolet)"/>
  </g>

  <!-- ===== Column 3: Insights ===== -->
  <!-- Top demanded: bar chart + trend arrow -->
  <g transform="translate(1250 165)" filter="url(#shadow)">
    <rect x="0"  y="80" width="28" height="50"  rx="6" fill="#fb7185"/>
    <rect x="36" y="60" width="28" height="70"  rx="6" fill="#fdba74"/>
    <rect x="72" y="35" width="28" height="95"  rx="6" fill="#86efac"/>
    <rect x="108" y="5" width="28" height="125" rx="6" fill="#2dd4bf"/>
    <polyline points="-6,62 40,28 66,52 126,-8" fill="none" stroke="#bae6fd" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="112,-20 142,-22 134,6" fill="#bae6fd"/>
  </g>
  <text x="1320" y="355" text-anchor="middle" font-size="31" font-weight="700" fill="#eafffb">Top Demanded Skills</text>

  <!-- High paying: bars + coin -->
  <g transform="translate(1250 455)" filter="url(#shadow)">
    <rect x="0"  y="70" width="28" height="60" rx="6" fill="#fdba74"/>
    <rect x="36" y="90" width="28" height="40" rx="6" fill="#86efac"/>
    <rect x="72" y="45" width="28" height="85" rx="6" fill="#fb7185"/>
    <rect x="108" y="20" width="28" height="110" rx="6" fill="#93c5fd"/>
    <polyline points="-6,60 30,40 56,62 124,-6" fill="none" stroke="#c4a3ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="110,-20 140,-22 132,6" fill="#c4a3ff"/>
    <circle cx="128" cy="112" r="30" fill="#fbbf24" stroke="#fff3c4" stroke-width="4"/>
    <circle cx="128" cy="112" r="21" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <text x="128" y="123" text-anchor="middle" font-size="32" font-weight="800" fill="#92400e">$</text>
  </g>
  <text x="1320" y="650" text-anchor="middle" font-size="31" font-weight="700" fill="#fff4cf">High Paying Skills</text>

  <!-- Optimal: gear + person -->
  <g transform="translate(1320 810)" filter="url(#shadow)">
    <circle r="58" fill="none" stroke="#a78bfa" stroke-width="22" stroke-dasharray="20 10.4"/>
    <circle r="54" fill="#8b7bff"/>
    <circle r="36" fill="#0b1226"/>
    <circle cx="0" cy="-10" r="11" fill="#c4b5fd"/>
    <path d="M-20 22 q0 -20 20 -20 q20 0 20 20 z" fill="#c4b5fd"/>
  </g>
  <text x="1320" y="945" text-anchor="middle" font-size="31" font-weight="700" fill="#f1ebff">Optimal Skills</text>
</svg>
